[project]
name = "gxr-studio"
version = "0.1.0"
description = "GXR 电脑工作室：与理光 GXR 配套的本地网页工具（M1：插卡导入、图库、裁切、导出）"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.4.3; sys_platform != 'win32'",
    "numpy==2.5.4; sys_platform == 'win32'",
    "scipy==1.17.1",
    "pillow==12.2.0",
    "fastapi==0.135.1",
    "starlette==0.52.1",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "anyio==4.13.0",
    "h11==0.16.0",
    "click==8.3.1",
    "typing-extensions==4.15.0",
    "sentry-sdk==2.72.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest-cov==7.1.0",
    "deptry==0.25.1",
    "vulture==2.16",
    "import-linter==2.15",
    "bandit==1.9.4",
    "pylint==4.1.3",
    "pytest-rerunfailures==16.7",
]

[project.scripts]
gxr-studio = "gxr_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxr_studio"]

# assets/ 在包目录里，wheel 默认就带上；再写 force-include 会重复加入同一个文件，构建失败。

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 144
src = ["src", "tests", "scripts"]
extend-exclude = [
    "src/gxr_studio/engine",
    "src/gxr_studio/lut/spaces.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "C90"]
# N818 会要求改掉 NoSpace、CardRemoved 这些已经在调用和测试里用着的异常名。
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# 这些文件里的大写变量是色度公式和矩阵的记号（L、C、T），不是常量。
"src/gxr_studio/engine/*.py" = ["N802", "N803", "N806"]
"src/gxr_studio/lut/colorimetry.py" = ["N806"]
"src/gxr_studio/lut/fit.py" = ["N806"]
"src/gxr_studio/raw/dng.py" = ["N806"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["gxr_studio"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
pretty = true
# engine/ 与 lut/spaces.py 被 PROVENANCE 和测试按字节锁定，注解在同目录的 .pyi 里。
# 不在这里放宽：存根让调用方仍然按 strict 检查。

[tool.importlinter]
root_packages = ["gxr_studio"]

[[tool.importlinter.contracts]]
name = "Runtime packages do not import devtools"
type = "forbidden"
source_modules = [
    "gxr_studio.api",
    "gxr_studio.app",
    "gxr_studio.cli",
    "gxr_studio.library",
    "gxr_studio.raw",
    "gxr_studio.engine",
    "gxr_studio.camdata",
    "gxr_studio.cards",
    "gxr_studio.render",
    "gxr_studio.lut",
    "gxr_studio.hdr",
    "gxr_studio.gpu",
]
forbidden_modules = ["gxr_studio.devtools"]

[[tool.importlinter.contracts]]
name = "Image and metadata code does not import the HTTP layer"
type = "forbidden"
source_modules = [
    "gxr_studio.raw",
    "gxr_studio.engine",
    "gxr_studio.crop",
    "gxr_studio.meta",
    "gxr_studio.hdr",
    "gxr_studio.gpu",
]
forbidden_modules = ["gxr_studio.api", "gxr_studio.app", "gxr_studio.cli"]

[tool.vulture]
min_confidence = 80
paths = ["src/gxr_studio"]
ignore_names = ["ctx", "model_config", "Wg"]

[tool.pylint.main]
ignore-paths = ["tests"]

[tool.pylint.similarities]
min-similarity-lines = 16
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

[tool.coverage.run]
source = ["gxr_studio"]

[tool.coverage.report]
fail_under = 85
show_missing = false

[tool.deptry.package_module_name_map]
Pillow = "PIL"

[tool.deptry.per_rule_ignores]
# 这些是 FastAPI / uvicorn / pydantic 实际会加载的库。写在直接依赖里是为了把版本钉死，源码不写 import 名字。
DEP002 = ["pydantic-core", "anyio", "h11", "click", "typing-extensions"]
