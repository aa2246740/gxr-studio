[project]
name = "gxr-studio"
version = "0.1.0"
description = "GXR 电脑工作室：与理光 GXR 配套的本地网页工具（M1：插卡导入、图库、裁切、导出）"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy==2.4.3",
    "scipy==1.17.1",
    "pillow==12.2.0",
    "fastapi==0.135.1",
    "starlette==0.52.1",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "anyio==4.13.0",
    "h11==0.16.0",
    "click==8.3.1",
    "typing-extensions==4.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
gxr-studio = "gxr_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gxr_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
