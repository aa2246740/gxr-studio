# std 的超越函数在不同平台上可能差最后一位。核心一律用 gxr_math（转调 libm），原生和 WASM 才逐位相同。
disallowed-methods = [
    { path = "f64::exp", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::exp2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::ln", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::log2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::log10", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::powf", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::powi", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::sin", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::cos", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::tan", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::atan2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::cbrt", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::hypot", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::exp", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::exp2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::ln", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::log2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::log10", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::powf", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::powi", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::sin", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::cos", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::tan", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::atan2", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::cbrt", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f32::hypot", reason = "use gxr_math (libm) for bit-identical native/wasm" },
    { path = "f64::mul_add", reason = "the Python reference never fuses multiply-add" },
    { path = "f32::mul_add", reason = "the Python reference never fuses multiply-add" },
]
