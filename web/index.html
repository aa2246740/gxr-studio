<!doctype html>
<!-- 页面数据来自本机接口（/api/cards、/api/photos、/api/jobs 等），见 studio/README.md。不引用任何外部资源。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:,">
  <title>GXR Studio</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">GXR Studio</div>
      <nav class="tabs" id="tabs">
        <a href="#/photos" data-tab="photos">照片</a>
        <a href="#/recipes" data-tab="recipes">配方</a>
        <a href="#/camera" data-tab="camera">相机</a>
      </nav>
      <div class="top-actions">
        <button id="btn-export-top" class="btn" type="button" title="导出（⌘E）">导出</button>
        <button id="btn-settings" class="btn ghost" type="button" title="设置（⌘,）">设置</button>
        <button id="btn-help" class="btn ghost" type="button" title="帮助">帮助</button>
      </div>
    </header>
    <div id="banner" class="banner-slot"></div>
    <div id="hints" class="hints"></div>
    <main id="view" class="view"></main>
    <footer class="statusbar">
      <span id="card-status">存储卡：未插入</span>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
