name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv build
      - run: uv run --frozen python scripts/release_notes.py
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
