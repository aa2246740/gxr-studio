name: ci

# 全量测试只能手动触发（2026-11-10 机主定的测试规矩）：日常测试全在本地跑，合并前以本地 `make check` 通过为准；
# GitHub 上的全量 CI 只在重大版本发布、机主明确要求时，到 Actions → ci → Run workflow 手动跑。
# push 和 PR 不再自动触发。Windows 先不走任何 CI。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Time the locked install
        run: python -c "import subprocess, time; started=time.perf_counter(); subprocess.check_call(['uv','sync','--frozen']); print(f'uv_sync_seconds {time.perf_counter()-started:.3f}')"
      # 显卡预览引擎：核对提交的 web/assets/gpu/ 与 frontend/ 源码一致；一致性测试用 Chrome 的 SwiftShader（不需要显卡）
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend build tools
        run: pnpm -C frontend install --frozen-lockfile
      - name: Install mobile build tools
        run: pnpm -C mobile install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.93.1"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - name: Install wasm-bindgen-cli 0.2.130
        run: cargo install --locked wasm-bindgen-cli --version 0.2.130
      - name: Lint, types, security, coverage
        env:
          PYTEST_ADDOPTS: "--force-reruns 0"
          GXR_REQUIRE_FRONTEND: "1"
          GXR_REQUIRE_GPU_TEST: "1"
          GXR_FUZZ_JOBS: "4"
        run: make check
      - name: DAST-style endpoint checks
        run: make dast
      - name: Coverage and timing artifacts
        if: always()
        run: mkdir -p artifacts && cp -f .coverage artifacts/coverage.sqlite || true

  # macOS 完整测试套件。显卡一致性用 Chrome 的软件适配器，找不到适配器就失败（GXR_REQUIRE_GPU_TEST=1）。
  tests:
    runs-on: macos-latest
    # 限时，并在单个测试超过 5 分钟时打印所有线程的调用栈
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Full test suite
        env:
          PYTEST_ADDOPTS: "--force-reruns 0"
          GXR_REQUIRE_GPU_TEST: "1"
          GXR_FUZZ_JOBS: "4"
        run: uv run --frozen pytest -vv --maxfail=10 --durations=20 -o faulthandler_timeout=300

  security-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Write a readable Bandit report
        run: uv run --frozen bandit -r src/gxr_studio -f txt -o bandit-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
