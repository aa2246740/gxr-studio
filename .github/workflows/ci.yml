name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Time the locked install
        run: python -c "import subprocess, time; started=time.perf_counter(); subprocess.check_call(['uv','sync','--frozen']); print(f'uv_sync_seconds {time.perf_counter()-started:.3f}')"
      # 显卡预览引擎：核对提交的 web/assets/gpu/ 与 frontend/ 源码一致；一致性测试用 Chrome 的 SwiftShader（不需要显卡）
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend build tools
        run: pnpm -C frontend install --frozen-lockfile
      - name: Lint, types, security, coverage
        env:
          GXR_REQUIRE_FRONTEND: "1"
          GXR_REQUIRE_GPU_TEST: "1"
        run: make check
      - name: DAST-style endpoint checks
        run: make dast
      - name: Coverage and timing artifacts
        if: always()
        run: mkdir -p artifacts && cp -f .coverage artifacts/coverage.sqlite || true

  # Windows 和 macOS：完整测试套件（复审 P1-04：应用要能在 Windows 上跑）。显卡一致性同样用 Chrome 的软件适配器，
  # 找不到适配器就失败（GXR_REQUIRE_GPU_TEST=1）。Windows 上 WebGPU 走 D3D12 的硬件路径要在实机确认，见 FIX_R1 报告。
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Full test suite
        env:
          GXR_REQUIRE_GPU_TEST: "1"
        run: uv run --frozen pytest -q --durations=20

  # Linux 上把 Windows 那条按路径的实现（没有 dir_fd）整套再跑一遍
  path-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --frozen
      - name: Full test suite with path-based IO
        env:
          GXR_FORCE_PATH_IO: "1"
          GXR_REQUIRE_GPU_TEST: "1"
        run: uv run --frozen pytest -q --durations=20

  security-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Write a readable Bandit report
        run: uv run --frozen bandit -r src/gxr_studio -f txt -o bandit-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt
