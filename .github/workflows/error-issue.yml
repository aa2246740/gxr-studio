name: error-issue

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

jobs:
  open-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue from the failed CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI failed ${HEAD}" \
            --label "type/bug,priority/p1,area/tooling" \
            --body "CI failed. Run: ${RUN_URL}"
